<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <radialGradient id="archGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1713" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#060709" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#00b377"/>
    </linearGradient>

    <linearGradient id="cfOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6821f"/>
      <stop offset="100%" stop-color="#faad3f"/>
    </linearGradient>

    <linearGradient id="pgBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#336791"/>
      <stop offset="100%" stop-color="#417ba8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dash 2.5s linear infinite;
    }
    .flow-reverse {
      stroke-dasharray: 6 6;
      animation: dash 2.5s linear infinite reverse;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#archGlow)"/>
  <rect width="100%" height="100%" fill="url(#archGrid)"/>

  <!-- Title & Header -->
  <text x="550" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    DriveQL End-to-End System &amp; Security Architecture
  </text>
  <text x="550" y="70" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
    Zero-Knowledge Encrypted PostgreSQL 16 Execution virtualized across Free Edge &amp; Cloud Storage
  </text>

  <!-- Column 1: Client Ingress & Applications -->
  <g transform="translate(40, 110)">
    <rect width="210" height="470" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Header -->
    <rect width="210" height="42" rx="10 10 0 0" fill="#13161f"/>
    <text x="105" y="26" fill="#f4f4f5" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. Client / Access Plane</text>

    <!-- Card 1: Studio UI -->
    <g transform="translate(15, 60)">
      <rect width="180" height="85" rx="6" fill="#07080b" stroke="rgba(0, 229, 153, 0.3)" stroke-width="1"/>
      <text x="14" y="24" fill="#00e599" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🖥️ Neon SQL Studio</text>
      <text x="14" y="44" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10">Web workstation with multi-tab editor, RLS identity simulator &amp; grid export</text>
    </g>

    <!-- Card 2: Postgres Wire Proxy -->
    <g transform="translate(15, 160)">
      <rect width="180" height="95" rx="6" fill="#07080b" stroke="rgba(51, 103, 145, 0.4)" stroke-width="1"/>
      <text x="14" y="24" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🔌 TCP Port 5432 Proxy</text>
      <text x="14" y="44" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10">psql, Prisma, Drizzle, Node-pg, TypeORM wire compatibility</text>
      <text x="14" y="80" fill="#3b82f6" font-family="monospace" font-size="9">DriveQL Wire Bridge (src/cli/proxy.mjs)</text>
    </g>

    <!-- Card 3: External API Keys -->
    <g transform="translate(15, 270)">
      <rect width="180" height="85" rx="6" fill="#07080b" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="14" y="24" fill="#e4e4e7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🔑 REST API Access</text>
      <text x="14" y="44" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="10">Programmatic access tokens with role scoping (Admin vs Read-Only)</text>
    </g>

    <!-- Card 4: Simulated Identities -->
    <g transform="translate(15, 370)">
      <rect width="180" height="80" rx="6" fill="#07080b" stroke="rgba(0, 229, 153, 0.2)" stroke-width="1"/>
      <text x="14" y="24" fill="#00e599" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">🛡️ RLS Headers</text>
      <text x="14" y="44" fill="#71717a" font-family="monospace" font-size="9.5">X-User-Id: usr_alice</text>
      <text x="14" y="60" fill="#71717a" font-family="monospace" font-size="9.5">X-User-Role: authenticated</text>
    </g>
  </g>

  <!-- Connectors 1 -> 2 -->
  <line x1="250" y1="210" x2="310" y2="210" stroke="#00e599" stroke-width="2" class="flow-line" filter="url(#softGlow)"/>
  <line x1="250" y1="315" x2="310" y2="315" stroke="#60a5fa" stroke-width="2" class="flow-line"/>
  <line x1="250" y1="420" x2="310" y2="420" stroke="#00e599" stroke-width="2" class="flow-line"/>

  <!-- Column 2: Cloudflare Workers Edge Security & Compute -->
  <g transform="translate(310, 110)">
    <rect width="250" height="470" rx="10" fill="url(#cardGrad)" stroke="rgba(246, 130, 31, 0.3)" stroke-width="1.2"/>
    <rect width="250" height="42" rx="10 10 0 0" fill="#1f140e"/>
    <text x="125" y="26" fill="#f6821f" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. Cloudflare Edge Gateway</text>

    <!-- Edge Rate Limiter -->
    <g transform="translate(15, 55)">
      <rect width="220" height="70" rx="6" fill="#08090c" stroke="rgba(246, 130, 31, 0.4)" stroke-width="1"/>
      <text x="12" y="22" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">⏱️ Edge Rate Limiter</text>
      <text x="12" y="40" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">Sliding window: 180 req/min per IP</text>
      <text x="12" y="55" fill="#f87171" font-family="monospace" font-size="9">HTTP 429 Too Many Requests</text>
    </g>

    <!-- Security Headers & Defense -->
    <g transform="translate(15, 135)">
      <rect width="220" height="85" rx="6" fill="#08090c" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="22" fill="#e4e4e7" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">🛡️ Defense-in-Depth Headers</text>
      <text x="12" y="40" fill="#71717a" font-family="monospace" font-size="9">X-Frame-Options: DENY</text>
      <text x="12" y="55" fill="#71717a" font-family="monospace" font-size="9">X-Content-Type: nosniff</text>
      <text x="12" y="70" fill="#71717a" font-family="monospace" font-size="9">200KB Query Payload Limit</text>
    </g>

    <!-- Astro SSR & API Endpoints -->
    <g transform="translate(15, 230)">
      <rect width="220" height="110" rx="6" fill="#08090c" stroke="rgba(0, 229, 153, 0.3)" stroke-width="1"/>
      <text x="12" y="22" fill="#00e599" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">🚀 Astro 5 SSR Runtime</text>
      <text x="12" y="42" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• /api/instances/[id]/query</text>
      <text x="12" y="58" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• /api/instances/[id]/policies (RLS)</text>
      <text x="12" y="74" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• /api/instances/[id]/schema</text>
      <text x="12" y="90" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• /api/instances/[id]/sync (WAL)</text>
    </g>

    <!-- Cloudflare D1 Catalog -->
    <g transform="translate(15, 350)">
      <rect width="220" height="100" rx="6" fill="#08090c" stroke="rgba(246, 130, 31, 0.3)" stroke-width="1"/>
      <text x="12" y="22" fill="#f6821f" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">🗄️ Cloudflare D1 Catalog</text>
      <text x="12" y="42" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">Users, Google Drive OAuth tokens,</text>
      <text x="12" y="58" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">instances metadata, hashed API keys,</text>
      <text x="12" y="74" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">and WAL checkpoints index.</text>
    </g>
  </g>

  <!-- Connectors 2 -> 3 -->
  <line x1="560" y1="285" x2="620" y2="285" stroke="#00e599" stroke-width="2.5" class="flow-line" filter="url(#softGlow)"/>
  <circle cx="590" cy="285" r="4" fill="#00e599" filter="url(#softGlow)"/>

  <!-- Column 3: PostgreSQL WASM Execution Engine -->
  <g transform="translate(620, 110)">
    <rect width="220" height="470" rx="10" fill="url(#cardGrad)" stroke="rgba(51, 103, 145, 0.4)" stroke-width="1.2"/>
    <rect width="220" height="42" rx="10 10 0 0" fill="#0c1724"/>
    <text x="110" y="26" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. PGlite WASM (PostgreSQL 16)</text>

    <!-- PGlite Core -->
    <g transform="translate(15, 55)">
      <rect width="190" height="105" rx="6" fill="#07080b" stroke="rgba(0, 229, 153, 0.4)" stroke-width="1"/>
      <text x="12" y="24" fill="#00e599" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">⚡ In-Memory Engine</text>
      <text x="12" y="44" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">PostgreSQL 16 compiled to WASM.</text>
      <text x="12" y="60" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">Sub-millisecond query execution.</text>
      <text x="12" y="85" fill="#00e599" font-family="monospace" font-size="10" font-weight="700">Latency: 0.4ms - 2ms</text>
    </g>

    <!-- Native RLS Enforcement -->
    <g transform="translate(15, 175)">
      <rect width="190" height="135" rx="6" fill="#07080b" stroke="rgba(0, 229, 153, 0.4)" stroke-width="1"/>
      <text x="12" y="24" fill="#00e599" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🛡️ Row-Level Security</text>
      <text x="12" y="44" fill="#71717a" font-family="monospace" font-size="9">authenticated / anon roles</text>
      <text x="12" y="60" fill="#71717a" font-family="monospace" font-size="9">SET LOCAL app.current_user_id</text>
      <text x="12" y="76" fill="#71717a" font-family="monospace" font-size="9">SET ROLE authenticated;</text>
      <text x="12" y="98" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">PostgreSQL native engine evaluates USING() &amp; WITH CHECK()</text>
    </g>

    <!-- In-Memory Isolate Caching -->
    <g transform="translate(15, 325)">
      <rect width="190" height="125" rx="6" fill="#07080b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="24" fill="#f4f4f5" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">🔄 State &amp; Cache Manager</text>
      <text x="12" y="44" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• Engine instance cache</text>
      <text x="12" y="60" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• Persistent memory tables</text>
      <text x="12" y="76" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• Live snapshot dump</text>
      <text x="12" y="92" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• Incremental WAL generator</text>
    </g>
  </g>

  <!-- Connectors 3 -> 4 -->
  <line x1="840" y1="285" x2="890" y2="285" stroke="#00e599" stroke-width="2.5" class="flow-line" filter="url(#softGlow)"/>
  <circle cx="865" cy="285" r="4" fill="#00e599" filter="url(#softGlow)"/>

  <!-- Column 4: Storage Virtual File System (VFS) & Google Drive -->
  <g transform="translate(890, 110)">
    <rect width="170" height="470" rx="10" fill="url(#cardGrad)" stroke="rgba(0, 229, 153, 0.3)" stroke-width="1.2"/>
    <rect width="170" height="42" rx="10 10 0 0" fill="#0a1a14"/>
    <text x="85" y="26" fill="#00e599" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. Virtual Drive Storage</text>

    <!-- Zero-Knowledge Encryption -->
    <g transform="translate(12, 55)">
      <rect width="146" height="90" rx="6" fill="#07080b" stroke="rgba(0, 229, 153, 0.4)" stroke-width="1"/>
      <text x="10" y="22" fill="#00e599" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">🔒 AES-256-GCM</text>
      <text x="10" y="42" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9">Zero-Knowledge client-side encryption. Google never sees plaintext SQL data.</text>
    </g>

    <!-- Drive VFS Orchestrator -->
    <g transform="translate(12, 160)">
      <rect width="146" height="110" rx="6" fill="#07080b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="10" y="22" fill="#f4f4f5" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">📂 Drive VFS</text>
      <text x="10" y="40" fill="#71717a" font-family="monospace" font-size="8.5">manifest.json</text>
      <text x="10" y="55" fill="#71717a" font-family="monospace" font-size="8.5">snapshot_*.tar.gz.enc</text>
      <text x="10" y="70" fill="#71717a" font-family="monospace" font-size="8.5">wal/00000001.wal.enc</text>
      <text x="10" y="90" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9">HTTP Range Block reads</text>
    </g>

    <!-- Physical Google Drive Target -->
    <g transform="translate(12, 285)">
      <rect width="146" height="165" rx="6" fill="#07080b" stroke="rgba(0, 229, 153, 0.3)" stroke-width="1"/>
      <text x="10" y="24" fill="#00e599" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">☁️ Google Drive Pool</text>
      <text x="10" y="44" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• 15 GB Free / Account</text>
      <text x="10" y="60" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• Multi-Account Linking</text>
      <text x="10" y="76" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• 30GB, 45GB+ Pools</text>
      <text x="10" y="96" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• Zero Cloud Cost</text>
      <text x="10" y="112" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="9.5">• OAuth2 `drive.file` scope</text>
      <rect x="10" y="130" width="126" height="22" rx="4" fill="rgba(0,229,153,0.15)"/>
      <text x="73" y="145" fill="#00e599" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">100% Free Tier</text>
    </g>
  </g>
</svg>
